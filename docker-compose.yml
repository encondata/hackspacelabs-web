# Slipway + PostgreSQL. Usage:
#   curl -fsSL https://raw.githubusercontent.com/encondata/slipway/main/install.sh | bash
# or by hand:
#   cp .env.example .env   # then fill in secrets (slipway generate-secrets) and GitHub OAuth app
#   docker compose up -d --build
# A fixed project name keeps container names (slipway-*) independent of the folder name.
name: slipway

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slipway
      POSTGRES_USER: slipway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slipway}
    volumes:
      # The database lives in a plain folder (default ./data/postgres) so it can be backed up with the
      # install; set SLIPWAY_DATA_DIR in .env to keep it elsewhere, such as an Unraid array share.
      - ${SLIPWAY_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slipway -d slipway"]
      interval: 5s
      timeout: 3s
      retries: 20

  slipway:
    build: .
    image: slipway:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # The password is passed separately (not pasted into the URL), so it may contain any character.
      # To use another database, override SLIPWAY_DATABASE_URL; a password written in that URL wins.
      SLIPWAY_DATABASE_URL: postgresql+asyncpg://slipway@db:5432/slipway
      SLIPWAY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-slipway}
    # Behind a reverse proxy: set SLIPWAY_FORWARDED_ALLOW_IPS in .env to the address or CIDR the proxy connects
    # from (as seen inside this container). Otherwise every client shares the proxy's IP, so failed logins
    # from anyone rate-limit everyone. Never use "*" (any client could forge its IP). If the proxy runs on
    # this machine, publish the port on loopback only, "127.0.0.1:${SLIPWAY_PORT:-8000}:8000", so clients
    # cannot bypass it.
    ports:
      - "${SLIPWAY_PORT:-8000}:8000"

