name: hackspacelabs
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate deployment/.env first}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Generate deployment/.env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate deployment/.env first}
      SLIPWAY_DB_PASSWORD: ${SLIPWAY_DB_PASSWORD:?Generate deployment/.env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-hackspacelabs.sh:ro
      # Also executed by scripts/setup.sh on every install so existing volumes gain the Slipway database.
      - ./postgres/slipway.sh:/docker-entrypoint-initdb.d/02-slipway.sh:ro
    healthcheck:
      # TCP, not the socket: first-boot init scripts run on a socket-only temporary server.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    restart: unless-stopped
    command: [start, --optimized, --import-realm]
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${AUTH_PORT:-8089}:8080"]
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/hsl_identity
      KC_DB_USERNAME: hsl_identity
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
      KC_HOSTNAME: ${AUTH_ORIGIN:-https://${AUTH_HOST:-auth.hackspacelabs.com}}
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN:-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:?Required for first startup}
      HSL_APP_ORIGIN: ${APP_ORIGIN:-https://${APP_HOST:-hackspacelabs.com}}
      HSL_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Required}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
  web:
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8088}:3000"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_MODE: ${AUTH_MODE:-https}
      PORT: '3000'
      APP_ORIGIN: ${APP_ORIGIN:-https://${APP_HOST:-hackspacelabs.com}}
      OIDC_ISSUER: ${AUTH_ORIGIN:-https://${AUTH_HOST:-auth.hackspacelabs.com}}/realms/hackspacelabs
      OIDC_CLIENT_ID: hackspacelabs-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Required}
      SESSION_SECRET: ${SESSION_SECRET:?Required}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Required}
      DATABASE_URL: postgres://hsl_web:${APP_DB_PASSWORD:?Required}@postgres:5432/hsl_sessions
      SLIPWAY_URL: http://slipway:8000
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks: [backend]
  slipway:
    # Deployment orchestration API (apps/slipway). Internal only: no published port. The web gateway proxies it at
    # /api/slipway, attaching the signed-in user's Keycloak access token, which Slipway verifies itself.
    build:
      context: ../apps/slipway
    image: hackspacelabs-slipway
    restart: unless-stopped
    environment:
      SLIPWAY_ENV: production
      SLIPWAY_ENV_FILE: ''
      SLIPWAY_BASE_URL: ${APP_ORIGIN:-https://${APP_HOST:-hackspacelabs.com}}
      SLIPWAY_SECRET_KEY: ${SLIPWAY_SECRET_KEY:?Required}
      SLIPWAY_ENCRYPTION_KEY: ${SLIPWAY_ENCRYPTION_KEY:?Required}
      SLIPWAY_DATABASE_URL: postgresql+asyncpg://hsl_slipway@postgres:5432/hsl_slipway
      SLIPWAY_DATABASE_PASSWORD: ${SLIPWAY_DB_PASSWORD:?Required}
      SLIPWAY_OIDC_ISSUER: ${AUTH_ORIGIN:-https://${AUTH_HOST:-auth.hackspacelabs.com}}/realms/hackspacelabs
      SLIPWAY_OIDC_INTERNAL_URL: http://keycloak:8080/realms/hackspacelabs
      SLIPWAY_OIDC_CLIENT_SECRET: ${SLIPWAY_OIDC_CLIENT_SECRET:?Required}
      # Optional GitHub OAuth app for "Connect GitHub". Callback: <APP_ORIGIN>/api/slipway/auth/github/callback
      SLIPWAY_GITHUB_CLIENT_ID: ${SLIPWAY_GITHUB_CLIENT_ID:-}
      SLIPWAY_GITHUB_CLIENT_SECRET: ${SLIPWAY_GITHUB_CLIENT_SECRET:-}
      SLIPWAY_GITHUB_SERVICE_TOKEN: ${SLIPWAY_GITHUB_SERVICE_TOKEN:-}
      # Only the gateway and other containers on the private backend network can reach Slipway; it records the
      # client address the gateway forwards (audit log only).
      SLIPWAY_FORWARDED_ALLOW_IPS: '*'
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
  configure-auth:
    profiles: [tools]
    image: hackspacelabs-web
    entrypoint: [node, /tools/configure-auth.mjs]
    volumes:
      - ./scripts/configure-auth.mjs:/tools/configure-auth.mjs:ro
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-https://${APP_HOST:-hackspacelabs.com}}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-https://${AUTH_HOST:-auth.hackspacelabs.com}}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Required}
      ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN:-bootstrap-admin}
      ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:?Required}
      SLIPWAY_OIDC_CLIENT_SECRET: ${SLIPWAY_OIDC_CLIENT_SECRET:?Required}
    networks: [backend]
volumes:
  postgres_data:
networks:
  backend:
    driver: bridge
