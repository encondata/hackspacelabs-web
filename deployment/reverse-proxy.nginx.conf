# Examples only: merge into your existing TLS virtual hosts.
# Replace SERVER_IP and certificate paths. No TLS certificate files are supplied.
server {
    listen 443 ssl;
    server_name hackspacelabs.com;
    ssl_certificate /YOUR/CERTIFICATE/fullchain.pem;
    ssl_certificate_key /YOUR/CERTIFICATE/privkey.pem;
    location = /healthz { return 404; }
    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass http://SERVER_IP:8088;
        proxy_set_header Host hackspacelabs.com;
        proxy_set_header X-Forwarded-Host hackspacelabs.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 443 ssl;
    server_name auth.hackspacelabs.com;
    ssl_certificate /YOUR/CERTIFICATE/fullchain.pem;
    ssl_certificate_key /YOUR/CERTIFICATE/privkey.pem;
    location / {
        proxy_pass http://SERVER_IP:8089;
        proxy_set_header Host auth.hackspacelabs.com;
        proxy_set_header X-Forwarded-Host auth.hackspacelabs.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
