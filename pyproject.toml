[project]
name = "kiln"
version = "0.1.0"
description = "Kiln: deploy GitHub repositories to your own Docker hosts over SSH. Deploy. Run. Observe."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.27",
    "asyncssh>=2.18",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[project.scripts]
kiln = "kiln.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kiln*"]

[tool.setuptools.package-data]
kiln = ["web/templates/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:asyncssh.*"]
